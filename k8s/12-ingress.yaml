apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ssp-ingress
  namespace: ssp
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "5"
spec:
  ingressClassName: nginx
  rules:
    - host: ssp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssp
                port:
                  number: 8080
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
