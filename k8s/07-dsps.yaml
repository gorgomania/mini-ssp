apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsp-adcorp
  namespace: ssp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsp-adcorp
  template:
    metadata:
      labels:
        app: dsp-adcorp
    spec:
      containers:
        - name: dsp
          image: mini-ssp-dsp:latest
          imagePullPolicy: IfNotPresent
          args: ["-name", "adcorp", "-port", "50051", "-boost-geo", "US", "-boost-price", "2.0"]
          ports:
            - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: dsp-adcorp
  namespace: ssp
spec:
  selector:
    app: dsp-adcorp
  ports:
    - port: 50051
---
