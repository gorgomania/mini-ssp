apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssp
  namespace: ssp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ssp
  template:
    metadata:
      labels:
        app: ssp
    spec:
      containers:
        - name: ssp
          image: mini-ssp-ssp:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-port"
            - "8080"
            - "-redis"
            - "redis:6379"
            - "-kafka"
            - "kafka:9092"
            - "-postgres"
            - "$(POSTGRES_DSN)"
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dsn
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /metrics
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ssp
  namespace: ssp
spec:
  type: NodePort
  selector:
    app: ssp
  ports:
    - port: 8080
      nodePort: 30080
