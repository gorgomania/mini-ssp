name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: test
        run: go test ./... -timeout 120s

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: build ssp
        run: docker build --target ssp -t mini-ssp-ssp:${{ github.sha }} .

      - name: build dsp
        run: docker build --target dsp -t mini-ssp-dsp:${{ github.sha }} .

      - name: build consumer
        run: docker build --target consumer -t mini-ssp-consumer:${{ github.sha }} .
