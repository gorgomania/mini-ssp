apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ .Release.Namespace }}
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS dsps (
        id        SERIAL PRIMARY KEY,
        name      VARCHAR(64) UNIQUE NOT NULL,
        grpc_addr VARCHAR(255) NOT NULL,
        active    BOOLEAN NOT NULL DEFAULT TRUE
    );
    CREATE TABLE IF NOT EXISTS freqcap_rules (
        id            SERIAL PRIMARY KEY,
        advertiser_id VARCHAR(64) UNIQUE NOT NULL,
        cap_limit     INT NOT NULL DEFAULT 3,
        window_secs   INT NOT NULL DEFAULT 3600
    );
    {{- range .Values.dsps }}
    INSERT INTO dsps (name, grpc_addr) VALUES ('{{ .name }}', 'dsp-{{ .name }}:50051') ON CONFLICT (name) DO NOTHING;
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          ports:
            - containerPort: 5432
          resources: {{ toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
