apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssp
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.ssp.replicas }}
  selector:
    matchLabels:
      app: ssp
  template:
    metadata:
      labels:
        app: ssp
    spec:
      containers:
        - name: ssp
          image: {{ .Values.image.ssp }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-port"
            - {{ .Values.ssp.port | quote }}
            - "-redis"
            - "redis:6379"
            - "-kafka"
            - "kafka:9092"
            - "-postgres"
            - "$(POSTGRES_DSN)"
            - "-freqcap-limit"
            - {{ .Values.freqcap.limit | quote }}
            - "-freqcap-window"
            - {{ .Values.freqcap.window | quote }}
            {{- if gt (float64 .Values.ssp.rateLimit) 0.0 }}
            - "-rate-limit"
            - {{ .Values.ssp.rateLimit | quote }}
            - "-rate-burst"
            - {{ .Values.ssp.rateBurst | quote }}
            {{- end }}
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dsn
          ports:
            - containerPort: {{ .Values.ssp.port }}
          resources: {{ toYaml .Values.ssp.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ssp.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.ssp.port }}
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ssp
  namespace: {{ .Release.Namespace }}
spec:
  type: NodePort
  selector:
    app: ssp
  ports:
    - port: {{ .Values.ssp.port }}
      nodePort: {{ .Values.ssp.nodePort }}
