apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-init
  namespace: {{ .Release.Namespace }}
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS default.auction_events
    (
        ts             DateTime,
        user_id        String,
        geo            LowCardinality(String),
        format         LowCardinality(String),
        advertiser_id  LowCardinality(String),
        clearing_price Float64
    )
    ENGINE = MergeTree()
    PARTITION BY toYYYYMM(ts)
    ORDER BY (geo, format, advertiser_id, ts);
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          ports:
            - containerPort: 8123
            - containerPort: 9000
          resources: {{ toYaml .Values.clickhouse.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["clickhouse-client", "--query", "SELECT 1"]
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["clickhouse-client", "--query", "SELECT 1"]
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init-sql
          configMap:
            name: clickhouse-init
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
    - name: native
      port: 9000
