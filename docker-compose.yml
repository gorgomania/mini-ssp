services:
  dsp-adcorp:
    build: { context: ., target: dsp }
    command: ["-name", "adcorp", "-port", "50051", "-boost-geo", "US", "-boost-price", "2.0"]
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -w1 localhost 50051 </dev/null"]
      interval: 1s
      timeout: 1s
      retries: 10

  dsp-medianet:
    build: { context: ., target: dsp }
    command: ["-name", "medianet", "-port", "50051", "-boost-geo", "EU", "-boost-price", "1.8"]
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -w1 localhost 50051 </dev/null"]
      interval: 1s
      timeout: 1s
      retries: 10

  dsp-quickads:
    build: { context: ., target: dsp }
    command: ["-name", "quickads", "-port", "50051", "-base-price", "1.0"]
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -w1 localhost 50051 </dev/null"]
      interval: 1s
      timeout: 1s
      retries: 10

  dsp-ruads:
    build: { context: ., target: dsp }
    command: ["-name", "ruads", "-port", "50051", "-boost-geo", "RU", "-boost-price", "1.2"]
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -w1 localhost 50051 </dev/null"]
      interval: 1s
      timeout: 1s
      retries: 10

  dsp-apacads:
    build: { context: ., target: dsp }
    command: ["-name", "apacads", "-port", "50051", "-boost-geo", "JP", "-boost-price", "1.5"]
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -w1 localhost 50051 </dev/null"]
      interval: 1s
      timeout: 1s
      retries: 10

  dsp-latamads:
    build: { context: ., target: dsp }
    command: ["-name", "latamads", "-port", "50051", "-boost-geo", "BR", "-boost-price", "1.0"]
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -w1 localhost 50051 </dev/null"]
      interval: 1s
      timeout: 1s
      retries: 10

  kafka:
    image: bitnami/kafka:3.9
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10

  ssp:
    build: { context: ., target: ssp }
    ports:
      - "8080:8080"
    command:
      - "-dsps"
      - "dsp-adcorp:50051,dsp-medianet:50051,dsp-quickads:50051,dsp-ruads:50051,dsp-apacads:50051,dsp-latamads:50051"
      - "-redis"
      - "redis:6379"
      - "-freqcap-limit"
      - "3"
      - "-freqcap-window"
      - "1h"
      - "-kafka"
      - "kafka:9092"
      - "-postgres"
      - "postgres://ssp:ssp@postgres:5432/ssp"
    depends_on:
      dsp-adcorp:
        condition: service_healthy
      dsp-medianet:
        condition: service_healthy
      dsp-quickads:
        condition: service_healthy
      dsp-ruads:
        condition: service_healthy
      dsp-apacads:
        condition: service_healthy
      dsp-latamads:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=ssp
      - POSTGRES_USER=ssp
      - POSTGRES_PASSWORD=ssp
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ssp"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 20s

  consumer:
    build: { context: ., target: consumer }
    command:
      - "-kafka"
      - "kafka:9092"
      - "-clickhouse"
      - "clickhouse:9000"
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - ssp

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_LOG_LEVEL=error
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
